services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 在构建时被硬编码到客户端 JS 中，必须通过 ARG 传递
        # 修改 FRONTEND_URL 后必须重新 build 镜像才能生效（docker compose build --no-cache app）
        # JWT_SECRET 禁止作为 build arg：真实密钥不得进入镜像层，仅运行时 environment 注入
        NEXT_PUBLIC_API_URL: ${FRONTEND_URL:-https://dsoj.run}
        NEXT_PUBLIC_BASE_URL: ${FRONTEND_URL:-https://dsoj.run}
    image: oj-platform:app
    # 默认仅绑定本机回环，避免 0.0.0.0 直接暴露应用端口；生产应经反向代理。
    # 需要外部访问时设 APP_HOST_BIND=0.0.0.0
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-3000}:3000"
    expose:
      - "3000"
    # .env 中 JUDGE_* / LOG_LEVEL / TRUSTED_PROXIES 等一并注入；下方 environment 覆盖敏感与必填项
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=mongodb://${MONGO_APP_USER:-ojuser}:${MONGO_APP_PASSWORD:?err}@mongo:27017/oj_platform?authSource=oj_platform&replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?err}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?err}
      - FRONTEND_URL=${FRONTEND_URL:-https://dsoj.run}
      # FORCE_SECURE_COOKIE 必须传递给容器：
      # - HTTP 部署（如 IP 测试）设为 false，否则 Cookie 无法设置，登录失败
      # - HTTPS 部署（域名+证书）设为 true 或不设置（默认 true）
      - FORCE_SECURE_COOKIE=${FORCE_SECURE_COOKIE:-true}
      - PORT=3000
      - REDIS_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-1}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    mem_limit: 2.5g
    cpus: "3"
    pids_limit: 512
    networks:
      - oj-network
    # tmpfs：评测临时文件（编译产物、stdin/stdout/answer）全部走内存，
    # 消除百万行 I/O 的磁盘延迟。512m 足够 3 并发测点（单测点峰值 ~100MB）。
    # 容器重启自动清空，无持久化需求。
    tmpfs:
      - /app/temp:rw,size=512m
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/public/uploads
      - app_testdata:/app/data/testdata
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # P0 修复（2026-07）：改用静态页面 /healthcheck-static 替代 /api/health
      #   之前用 /api/health 反复失败：
      #     - API route 是动态路由，依赖 next-runtime 正确编译并注册
      #     - standalone 模式下 dynamic API route 注册可能有问题
      #     - 任何 import 失败或编译异常都会让 route 失效返回 404
      #   静态页面优势：
      #     - 编译期固定产物 (.next/server/app/healthcheck-static.html)
      #     - 不依赖任何 lib / withApi / 工具函数
      #     - 即便应用其他模块崩了，只要 Next.js 还能响应 HTTP 就返回 200
      #     - 容器编排层真正判断"进程还活着"
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/healthcheck-static",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?err}
      - MONGO_APP_USER=${MONGO_APP_USER:-ojuser}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?err}
    entrypoint: ["/bin/bash", "/scripts/mongo-init.sh"]
    command: --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo/keyfile
    restart: always
    mem_limit: 1g
    networks:
      - oj-network
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./scripts/mongo-init.sh:/scripts/mongo-init.sh:ro
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      # 宿主机 keyfile 挂载进容器，避免容器重建后 keyfile 变化导致副本集认证失败
      # 部署脚本会在首次运行时生成 ./mongo-keyfile
      - ./mongo-keyfile:/tmp/mongo-keyfile:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # 启用 --auth 后无凭证 ping 常失败；且须要求 PRIMARY（仅 ping 在未 initiate 时也可能成功）
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.hello().isWritablePrimary" | grep -q true',
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?err} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?err}
    restart: always
    mem_limit: 256m
    networks:
      - oj-network
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # 密码走环境变量，避免出现在 docker inspect / ps 命令行参数中
      test:
        [
          "CMD",
          "sh",
          "-c",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  app_logs:
  app_uploads:
  app_testdata:

networks:
  oj-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
