# 大山 OJ - 安全合规日志留存配置
#
# 依据《网络安全法》第二十一条：网络日志留存时间不得少于 6 个月。
# 本配置对 nginx 访问/错误日志按日轮转，保留 180 天并压缩归档。
#
# 同时覆盖两种部署形态：
#   - 独立 nginx：/var/log/nginx/
#   - 宝塔面板：/www/wwwlogs/（站点访问日志）
#   - 应用日志：/app/logs/（app 容器内路径；若以 bind mount 挂载到宿主机，此处生效）
#
# 安装：sudo bash scripts/setup-logrotate.sh

/var/log/nginx/*.log /www/wwwlogs/*.log /app/logs/*.log {
    daily
    rotate 180
    dateext
    dateformat -%Y%m%d
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid` 2>/dev/null || true
    endscript
}
